apply plugin: 'com.android.application'

android {
    namespace "org.openttd.sdl"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "org.openttd.sdl"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "15.3"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            // 我们的 libmain.so / libSDL2.so / libc++_shared.so 预编译好后放这里
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    lint {
        abortOnError false
    }
}
